<body>
    
    <h1 class="uppertext">Arthmatic Operator looks like Calculator</h1>
    <div class="othdiv">
    <hr id="line">
    </div>



    <div class="pardiv">
    <div class="caldiv">
        <h1 class="uppertext2">Harsh's Calculator</h1>
        <form class="form">
            <div id="answerbox"></div>
            <input type="number" name="First Number" placeholder="First Number" id="c1">
            <input type="number" namr="Second Number" placeholder="Second Number" id="c2">
            <button class="b1" onclick="return add()">Add(+)</button>
            <button class="b2" onclick="return sub()">Subtract(-)</button>
            <button class="b3" onclick="return mul()">Multiply(*)</button>
            <button class="b4" onclick="return div()">Divide(/)</button>
            <button class="b5" onclick="return rem()">Reminder(%)</button>
            <input type="reset" name="reset" class="br6">
        </form>
    </div>
    </div>

    <script>

        function add()
        {
            var w = document.getElementById("c1").value;
            var x = document.getElementById("c2").value;
            var y = Number(w) + Number(x);
            var z = document.getElementById("answerbox");
            z.innerHTML="Answer: "+y;
            return false;

        }

        function sub()
        {
            var w = document.getElementById("c1").value;
            var x = document.getElementById("c2").value;
            var y = w-x;
            var z = document.getElementById("answerbox");
            z.innerHTML="Answer: "+y;
            return false;
            

        }
 
        function mul()
        {
            var w = document.getElementById("c1").value;
            var x = document.getElementById("c2").value;
            var y = w*x;
            var z = document.getElementById("answerbox");
            z.innerHTML="Answer: "+y;
            return false;

        }
        function div()
        {
            var w = document.getElementById("c1").value;
            var x = document.getElementById("c2").value;
            var y = w/x;
            var z = document.getElementById("answerbox");
            z.innerHTML="Answer: "+y;
            return false;

        }

        function rem()
        {
            var w = document.getElementById("c1").value;
            var x = document.getElementById("c2").value;
            var y = w%x;
            var z = document.getElementById("answerbox");
            z.innerHTML="Answer: "+y;
            return false;

        }





    </script>
